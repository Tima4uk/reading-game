<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#4A90E2">
  <title>Словознайка / Słowotwórca — Учимся читать</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@600;700&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=10">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>✨</text></svg>">
</head>
<body>
  <!-- Canvas для анимации конфетти -->
  <canvas id="confetti-canvas"></canvas>

  <div class="app-wrapper">
    <!-- Верхняя панель: Язык, Звезды, Настройки -->
    <!-- Компактная верхняя панель: Бренд, Режимы, Язык и Управление -->
    <header class="app-header">
      <div class="header-left">
        <h1 class="app-title" id="app-title">Словознайка</h1>
        <!-- Профиль игрока -->
        <button class="profile-badge" id="btn-profile" title="Сменить игрока">
          <span class="profile-avatar" id="header-profile-avatar">👦</span>
          <span class="profile-name" id="header-profile-name">Игрок 1</span>
        </button>
        <!-- Счетчик звезд -->
        <div class="star-badge" title="Собранные звездочки">
          <span class="star-icon">⭐</span>
          <span class="star-count" id="star-count">0</span>
        </div>
        <!-- Альбом наклеек -->
        <button class="album-badge" id="btn-album" title="Альбом наклеек">
          <span class="album-icon">📖</span>
          <span class="album-text" id="header-album-text">0/24</span>
        </button>
      </div>

      <!-- Вкладки режимов игры -->
      <nav class="mode-nav">
        <button class="mode-tab active" id="tab-search" title="Сетка слов">
          <span class="tab-icon">🔍</span>
          <span class="tab-text">Сетка</span>
        </button>
        <button class="mode-tab" id="tab-builder" title="Собери слово">
          <span class="tab-icon">🧩</span>
          <span class="tab-text">Слово</span>
        </button>
        <button class="mode-tab" id="tab-logic" title="Умные слова">
          <span class="tab-icon">🧠</span>
          <span class="tab-text">Логика</span>
        </button>
        <button class="mode-tab" id="tab-alphabet" title="Азбука">
          <span class="tab-icon">🔤</span>
          <span class="tab-text">Азбука</span>
        </button>
        <button class="mode-tab" id="tab-translate" title="Перевод слов">
          <span class="tab-icon">🌍</span>
          <span class="tab-text">Перевод</span>
        </button>
      </nav>

      <div class="header-right">
        <!-- Переключатель языков: RU / PL / EN -->
        <div class="lang-selector">
          <button class="lang-btn active" id="btn-lang-ru" title="Русский язык">
            <span class="flag-icon">🇷🇺</span>
            <span class="lang-text">RU</span>
          </button>
          <button class="lang-btn" id="btn-lang-pl" title="Język polski">
            <span class="flag-icon">🇵🇱</span>
            <span class="lang-text">PL</span>
          </button>
          <button class="lang-btn" id="btn-lang-en" title="English">
            <span class="flag-icon">🇬🇧</span>
            <span class="lang-text">EN</span>
          </button>
        </div>

        <!-- Кнопка звука -->
        <button class="icon-btn" id="btn-sound" title="Вкл / Выкл звук">🔊</button>

        <!-- Кнопка на весь экран (удобно для планшета) -->
        <button class="icon-btn" id="btn-fullscreen" title="На весь экран">⛶</button>
      </div>
    </header>

    <!-- Игровая область -->
    <main class="main-content">
      <div id="game-area"></div>
    </main>

    <!-- Подсказка для ребенка внизу -->
    <footer class="app-footer">
      <span>Нажимай на слова, чтобы услышать, как они звучат! 🔊</span>
    </footer>
  </div>

  <!-- Модальное окно победы в раунде -->
  <div class="modal-overlay hidden" id="celebration-modal">
    <div class="modal-card">
      <div class="modal-trophy">🏆⭐🎉</div>
      <h2 class="modal-title" id="modal-title">Ура! Все слова найдены!</h2>
      <p class="modal-subtitle">+3 ⭐ в копилку!</p>
      <button class="modal-btn" id="btn-next-round">Играть ещё! 🚀</button>
    </div>
  </div>

  <!-- Модальное окно выбора/настройки профиля игрока -->
  <div class="modal-overlay hidden" id="profile-modal">
    <div class="modal-card profile-modal-card">
      <button class="modal-close-icon" id="btn-close-profile" title="Закрыть">✖</button>
      <h2 class="modal-title" id="profile-modal-title">Кто сейчас играет?</h2>
      
      <div class="profiles-list">
        <div class="player-card" id="card-player1">
          <div class="player-avatar" id="avatar-player1">👦</div>
          <div class="player-info">
            <div class="player-name" id="name-player1">Игрок 1</div>
            <div class="player-stars">⭐ <span id="stars-player1">0</span></div>
          </div>
          <button class="player-select-btn" id="select-player1">Выбрать</button>
        </div>

        <div class="player-card" id="card-player2">
          <div class="player-avatar" id="avatar-player2">👧</div>
          <div class="player-info">
            <div class="player-name" id="name-player2">Игрок 2</div>
            <div class="player-stars">⭐ <span id="stars-player2">0</span></div>
          </div>
          <button class="player-select-btn" id="select-player2">Выбрать</button>
        </div>
      </div>

      <!-- Настройка активного профиля -->
      <div class="profile-edit-section">
        <div class="profile-edit-title" id="profile-edit-title">Настроить профиль:</div>
        <div class="profile-input-row">
          <input type="text" id="profile-name-input" class="profile-name-input" maxlength="12" placeholder="Имя игрока" />
          <button class="profile-save-btn" id="btn-save-name">Сохранить</button>
        </div>
        <div class="profile-avatars-label" id="profile-avatars-label">Выбери значок:</div>
        <div class="profile-avatars-grid">
          <button class="avatar-pick-btn" data-avatar="👦">👦</button>
          <button class="avatar-pick-btn" data-avatar="👧">👧</button>
          <button class="avatar-pick-btn" data-avatar="🦁">🦁</button>
          <button class="avatar-pick-btn" data-avatar="🐱">🐱</button>
          <button class="avatar-pick-btn" data-avatar="🐶">🐶</button>
          <button class="avatar-pick-btn" data-avatar="🦊">🦊</button>
          <button class="avatar-pick-btn" data-avatar="🐼">🐼</button>
          <button class="avatar-pick-btn" data-avatar="🐰">🐰</button>
          <button class="avatar-pick-btn" data-avatar="🐯">🐯</button>
          <button class="avatar-pick-btn" data-avatar="🚀">🚀</button>
          <button class="avatar-pick-btn" data-avatar="🦖">🦖</button>
          <button class="avatar-pick-btn" data-avatar="🦄">🦄</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Модальное окно альбома наклеек -->
  <div class="modal-overlay hidden" id="album-modal"></div>

  <script type="module" src="src/app.js?v=10"></script>
</body>
</html>
