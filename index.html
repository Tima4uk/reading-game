<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#4A90E2">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Словознайка / Słowotwórca — Учимся читать</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@700&family=Marck+Script&family=Nunito:wght@600;700;800;900&family=Playwrite+PL:wght@400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=33">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>✨</text></svg>">
</head>
<body>
  <!-- Canvas для анимации конфетти -->
  <canvas id="confetti-canvas"></canvas>

  <div class="app-wrapper">
    <!-- Верхняя панель: Язык, Звезды, Настройки -->
    <!-- Компактная верхняя панель: Бренд, Режимы, Язык и Управление -->
    <header class="app-header">
      <div class="header-left">
        <h1 class="app-title" id="app-title">Словознайка</h1>
        <!-- Профиль игрока -->
        <button class="profile-badge" id="btn-profile" title="Сменить игрока">
          <span class="profile-avatar" id="header-profile-avatar">👦</span>
          <span class="profile-name" id="header-profile-name">Игрок 1</span>
        </button>
        <!-- Счетчик звезд -->
        <div class="star-badge" title="Собранные звездочки">
          <span class="star-icon">⭐</span>
          <span class="star-count" id="star-count">0</span>
        </div>
        <!-- Альбом наклеек -->
        <button class="album-badge" id="btn-album" title="Альбом наклеек">
          <span class="album-icon">🎁</span>
          <span class="album-text" id="header-album-text">0/24</span>
        </button>
      </div>

      <!-- Вкладки режимов игры -->
      <nav class="mode-nav">
        <button class="mode-tab" id="tab-letters" title="Буквы и прописи">
          <span class="tab-icon">📕</span>
          <span class="tab-text">Буквы</span>
        </button>
        <button class="mode-tab" id="tab-reading" title="Учимся читать слоги и тексты">
          <span class="tab-icon">📖</span>
          <span class="tab-text">Чтение</span>
        </button>
        <button class="mode-tab active" id="tab-words" title="Игры со словами и логика">
          <span class="tab-icon">🧩</span>
          <span class="tab-text">Слова</span>
        </button>
        <button class="mode-tab" id="tab-translate" title="Перевод слов">
          <span class="tab-icon">🌍</span>
          <span class="tab-text">Перевод</span>
        </button>
      </nav>

      <div class="header-right">
        <!-- Компактная кнопка настроек (защита от случайных нажатий детьми) -->
        <button class="icon-btn settings-trigger-btn" id="btn-settings" title="Настройки">
          <span class="settings-flag" id="header-lang-flag">🇷🇺</span>
          <svg class="ui-svg-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z"/></svg>
        </button>
      </div>
    </header>

    <!-- Игровая область -->
    <main class="main-content">
      <div id="game-area"></div>
    </main>

    <!-- Динамическая подсказка для ребенка внизу -->
    <footer class="app-footer">
      <span id="footer-hint">Нажимай на слова, чтобы услышать, как они звучат! 🔊</span>
    </footer>
  </div>

  <!-- Модальное окно победы в раунде -->
  <div class="modal-overlay hidden" id="celebration-modal">
    <div class="modal-card">
      <div class="modal-trophy">🏆⭐🎉</div>
      <h2 class="modal-title" id="modal-title">Ура! Все слова найдены!</h2>
      <p class="modal-subtitle">+3 ⭐ в копилку!</p>
      <button class="modal-btn" id="btn-next-round">Играть ещё! 🚀</button>
    </div>
  </div>

  <!-- Модальное окно выбора/настройки профиля игрока -->
  <div class="modal-overlay hidden" id="profile-modal">
    <div class="modal-card profile-modal-card">
      <button class="modal-close-icon" id="btn-close-profile" title="Закрыть" aria-label="Закрыть"><svg class="ui-svg-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
      <h2 class="modal-title" id="profile-modal-title">Кто сейчас играет?</h2>
      
      <div class="profiles-list">
        <div class="player-card" id="card-player1">
          <div class="player-avatar" id="avatar-player1">👦</div>
          <div class="player-info">
            <div class="player-name" id="name-player1">Игрок 1</div>
            <div class="player-meta-row">
              <span class="player-stars">⭐ <span id="stars-player1">0</span></span>
              <span class="player-stickers">🎁 <span id="stickers-player1">0/24</span></span>
              <span class="player-meta-badge" id="meta-player1"></span>
            </div>
          </div>
          <button class="player-select-btn" id="select-player1">Выбрать</button>
        </div>

        <div class="player-card" id="card-player2">
          <div class="player-avatar" id="avatar-player2">👧</div>
          <div class="player-info">
            <div class="player-name" id="name-player2">Игрок 2</div>
            <div class="player-meta-row">
              <span class="player-stars">⭐ <span id="stars-player2">0</span></span>
              <span class="player-stickers">🎁 <span id="stickers-player2">0/24</span></span>
              <span class="player-meta-badge" id="meta-player2"></span>
            </div>
          </div>
          <button class="player-select-btn" id="select-player2">Выбрать</button>
        </div>
      </div>

      <!-- Настройка активного профиля -->
      <div class="profile-edit-section">
        <div class="profile-edit-title" id="profile-edit-title">Настроить профиль:</div>
        <div class="profile-input-row">
          <input type="text" id="profile-name-input" class="profile-name-input" maxlength="12" placeholder="Имя игрока" />
          <button class="profile-save-btn" id="btn-save-name">Сохранить</button>
        </div>
        <div class="profile-avatars-label" id="profile-diff-label">Уровень сложности:</div>
        <div class="profile-diff-row">
          <button class="profile-diff-btn active" id="btn-profile-diff-easy" data-diff="easy">🐣 Лёгкий (3–4)</button>
          <button class="profile-diff-btn" id="btn-profile-diff-hard" data-diff="hard">🚀 Мастер (5+)</button>
        </div>
        <div class="profile-avatars-label" id="profile-avatars-label">Выбери значок:</div>
        <div class="profile-avatars-grid">
          <button class="avatar-pick-btn" data-avatar="👦">👦</button>
          <button class="avatar-pick-btn" data-avatar="👧">👧</button>
          <button class="avatar-pick-btn" data-avatar="🦁">🦁</button>
          <button class="avatar-pick-btn" data-avatar="🐱">🐱</button>
          <button class="avatar-pick-btn" data-avatar="🐶">🐶</button>
          <button class="avatar-pick-btn" data-avatar="🦊">🦊</button>
          <button class="avatar-pick-btn" data-avatar="🐼">🐼</button>
          <button class="avatar-pick-btn" data-avatar="🐰">🐰</button>
          <button class="avatar-pick-btn" data-avatar="🐯">🐯</button>
          <button class="avatar-pick-btn" data-avatar="🚀">🚀</button>
          <button class="avatar-pick-btn" data-avatar="🦖">🦖</button>
          <button class="avatar-pick-btn" data-avatar="🦄">🦄</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Модальное окно настроек (Язык, Звук, Экран, Лицензия) -->
  <div class="modal-overlay hidden" id="settings-modal">
    <div class="modal-card settings-modal-card">
      <button class="modal-close-icon" id="btn-close-settings" title="Закрыть" aria-label="Закрыть"><svg class="ui-svg-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
      <h2 class="modal-title" id="settings-modal-title">⚙️ Настройки</h2>

      <div class="settings-section">
        <div class="settings-label" id="settings-lang-label">Язык игры:</div>
        <div class="lang-selector settings-lang-selector">
          <button class="lang-btn active" id="btn-lang-ru" title="Русский язык">
            <span class="flag-icon">🇷🇺</span>
            <span class="lang-text">RU</span>
          </button>
          <button class="lang-btn" id="btn-lang-pl" title="Język polski">
            <span class="flag-icon">🇵🇱</span>
            <span class="lang-text">PL</span>
          </button>
          <button class="lang-btn" id="btn-lang-en" title="English">
            <span class="flag-icon">🇬🇧</span>
            <span class="lang-text">EN</span>
          </button>
        </div>
      </div>

      <div class="settings-section">
        <div class="settings-label" id="settings-theme-label">Тема оформления:</div>
        <div class="settings-theme-grid" id="settings-theme-grid">
          <button type="button" class="theme-pick-btn active" data-theme-id="day" id="btn-theme-day">☀️ День</button>
          <button type="button" class="theme-pick-btn" data-theme-id="forest" id="btn-theme-forest">🌿 Лес</button>
          <button type="button" class="theme-pick-btn" data-theme-id="cozy" id="btn-theme-cozy">🌙 Вечер</button>
          <button type="button" class="theme-pick-btn" data-theme-id="space" id="btn-theme-space">🚀 Космос</button>
        </div>
      </div>

      <div class="settings-section">
        <div class="settings-label" id="settings-controls-label">Звук и экран:</div>
        <div class="settings-actions-row">
          <button class="settings-action-btn" id="btn-sound" title="Вкл / Выкл звук">🔊 Звук вкл.</button>
          <button class="settings-action-btn" id="btn-fullscreen" title="На весь экран">⛶ Полный экран</button>
        </div>
      </div>

      <div class="settings-footer">
        <a href="LICENSE" target="_blank" rel="noopener" class="footer-license-link" title="Open MIT License">MIT License</a>
      </div>
    </div>
  </div>

  <!-- Модальное окно альбома наклеек -->
  <div class="modal-overlay hidden" id="album-modal"></div>

  <script type="module" src="src/app.js?v=33"></script>
</body>
</html>
